services:
  backend:
    build: ./backend
    # ports で公開しない。ホストに 8080 を晒すと nginx を迂回して直接叩けてしまい、
    # X-Forwarded-For を自由に詐称できるためレート制限が無意味になる。
    # バックエンドへは frontend の nginx (/api/) 経由でのみ到達する。
    expose:
      - "8080"
    environment:
      # 上の expose と必ずセットで設定すること。バックエンドを直接公開したまま
      # これを有効にすると、ヘッダー詐称でレート制限を回避されるようになる。
      SHIELDSCAN_TRUST_PROXY: "true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
