version: 2

updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # パッチ・マイナー更新は1つのPRにまとめ、レビュー負荷を下げる。
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: docker
    directories:
      - /backend
      - /frontend
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Dependabot は「新しいバージョンか」しか見ず、安定版か開発版かを区別しない。
      # nginx と node はどちらもバージョン番号で系統が分かれるため、
      # 安定版ライン内の patch 更新だけを受け取り、ライン自体の移行は手動で行う。
      #
      # nginx: 奇数マイナーが mainline、偶数が stable。1.30 は stable、1.31 は mainline。
      - dependency-name: "nginx"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
      # node: 偶数メジャーのみ LTS になる。24 は LTS (Krypton)、25 は Current で
      # 約6ヶ月でEOL。次に上げるのは 26 が LTS になってから（2026-10 予定）。
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
